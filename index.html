<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KM Diário" />
    <title>GELOCRIM — Sistema de Frotas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registra Service Worker apenas na rota /pwa
      if ('serviceWorker' in navigator && window.location.pathname.startsWith('/pwa')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/pwa' })
            .then((reg) => {
              // Detecta nova versão disponível
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Dispara evento para o React exibir o banner
                    window.dispatchEvent(new CustomEvent('sw-update-available', { detail: { reg } }));
                  }
                });
              });
            })
            .catch((err) => console.warn('SW registro falhou:', err));
        });
      }
    </script>
  </body>
</html>
